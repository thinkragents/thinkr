# Render's free plan sleeps a service after 15 minutes without a request, and the
# next call waits 30 to 50 seconds for it to wake. An agent checking a bond before
# it pays would time out. A request every 10 minutes keeps it awake; one service
# running all month stays inside Render's 750 free hours.
# GitHub pauses scheduled workflows after 60 days with no commits: re-enable it
# under Actions if that happens, or move the API to a paid plan.
name: keep api awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://api.thinkr.tech/health
